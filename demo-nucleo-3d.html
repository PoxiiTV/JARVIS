<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — demo núcleo 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
  :root { --cyan:#00d4ff; --bg:#02060c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); overflow:hidden; font-family:"Segoe UI", system-ui, sans-serif; color:#d7f4ff; }
  canvas { display:block; }
  .hint {
    position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:4;
    font-size:12px; letter-spacing:.14em; color:#4d7a8c; text-transform:uppercase;
    pointer-events:none; text-align:center;
  }
  .hint b { color:#7fd4ee; font-weight:600; }
  .ui {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    z-index:4; display:flex; gap:8px;
  }
  .ui button {
    background:rgba(4,22,38,.75); border:1px solid rgba(0,212,255,.28);
    color:#9fd4e8; padding:8px 14px; border-radius:8px; cursor:pointer;
    font:500 12px/1 "Segoe UI", system-ui, sans-serif; letter-spacing:.08em; text-transform:uppercase;
  }
  .ui button:hover, .ui button.on {
    border-color:var(--cyan); color:#fff; box-shadow:0 0 16px rgba(0,212,255,.25);
  }
</style>
</head>
<body>
  <p class="hint">arrastra para girar · rueda para zoom · <b>gira sola</b></p>
  <div class="ui">
    <button data-mode="idle" class="on">Idle</button>
    <button data-mode="thinking">Piensa</button>
    <button data-mode="speaking">Habla</button>
  </div>
<script>
(function () {
  if (!window.THREE) return;

  const CYAN = 0x00d4ff;
  const ICE  = 0x7af0ff;
  const DEEP = 0x1488c8;
  let mode = 'idle';

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x02060c, 1);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 2000);
  camera.position.set(0, 18, 260);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.enablePan = false;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.1;
  controls.minDistance = 140;
  controls.maxDistance = 480;
  controls.target.set(0, 0, 0);

  function glowTex() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.2, 'rgba(180,245,255,.85)');
    gr.addColorStop(0.55, 'rgba(0,212,255,.2)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const gtex = glowTex();

  function lineMat(color, opacity) {
    return new THREE.LineBasicMaterial({
      color, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
  }
  function meshMat(color, opacity) {
    return new THREE.MeshBasicMaterial({
      color, transparent: true, opacity,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
  }

  const globe = new THREE.Group();
  scene.add(globe);
  const layerA = new THREE.Group();
  const layerB = new THREE.Group();
  const layerC = new THREE.Group();
  globe.add(layerA, layerB, layerC);

  function wireSphere(radius, wSeg, hSeg, color, opacity) {
    const geo = new THREE.SphereGeometry(radius, wSeg, hSeg);
    const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geo), lineMat(color, opacity));
    geo.dispose();
    return wire;
  }

  /* jaula esférica: meridianos + paralelos (es una bola de verdad) */
  layerA.add(wireSphere(36, 18, 12, ICE,  0.22));
  layerB.add(wireSphere(58, 28, 18, CYAN, 0.28));
  layerC.add(wireSphere(82, 40, 24, DEEP, 0.32));

  function torusRing(radius, tube, color, opacity, arc) {
    return new THREE.Mesh(
      new THREE.TorusGeometry(radius, tube, 8, 96, arc == null ? Math.PI * 2 : arc),
      meshMat(color, opacity)
    );
  }

  /* anillos grandes en distintos planos — volumen de esfera */
  const equator = torusRing(82.5, 0.55, CYAN, 0.85);
  equator.rotation.x = Math.PI / 2;
  layerC.add(equator);

  const mer1 = torusRing(82.5, 0.28, ICE, 0.55);
  layerB.add(mer1);
  const mer2 = torusRing(82.5, 0.28, CYAN, 0.45);
  mer2.rotation.y = Math.PI / 2;
  layerB.add(mer2);
  const mer3 = torusRing(82.5, 0.22, DEEP, 0.4);
  mer3.rotation.y = Math.PI / 3;
  mer3.rotation.x = 0.4;
  layerA.add(mer3);

  /* paralelos (latitudes) */
  [-0.62, -0.32, 0.32, 0.62].forEach((lat, i) => {
    const y = lat * 82;
    const r = Math.sqrt(82 * 82 - y * y);
    const t = torusRing(r, i % 2 ? 0.18 : 0.32, i % 2 ? ICE : CYAN, 0.5);
    t.rotation.x = Math.PI / 2;
    t.position.y = y;
    layerC.add(t);
  });

  /* anillo exterior con muescas (el “engranaje” de la captura) */
  const rim = new THREE.Group();
  rim.add(torusRing(94, 0.9, CYAN, 0.7));
  rim.rotation.x = Math.PI / 2;
  const tickMat = meshMat(ICE, 0.8);
  const TICKS = 72;
  for (let i = 0; i < TICKS; i++) {
    const a = (i / TICKS) * Math.PI * 2;
    const long = i % 6 === 0;
    const h = long ? 5.5 : 2.2;
    const tick = new THREE.Mesh(new THREE.BoxGeometry(0.35, h, 0.35), tickMat);
    tick.position.set(Math.cos(a) * 97.5, Math.sin(a) * 97.5, 0);
    tick.rotation.z = a + Math.PI / 2;
    rim.add(tick);
  }
  layerC.add(rim);

  /* segundo aro dentado, inclinado */
  const rim2 = rim.clone();
  rim2.rotation.set(0.7, 0.25, 0.4);
  rim2.scale.setScalar(0.72);
  layerB.add(rim2);

  /* arcos de datos (segmentos rotos, como en la foto) */
  const arcs = new THREE.Group();
  layerA.add(arcs);
  for (let i = 0; i < 22; i++) {
    const r = 40 + (i % 7) * 7;
    const arcLen = 0.45 + (i % 5) * 0.35;
    const tube = 0.1 + (i % 3) * 0.12;
    const mesh = torusRing(r, tube, i % 2 ? ICE : CYAN, 0.55 + (i % 3) * 0.12, arcLen);
    mesh.rotation.set(
      (i * 0.7) % Math.PI,
      (i * 1.3) % (Math.PI * 2),
      (i * 0.4) % Math.PI
    );
    arcs.add(mesh);
  }

  /* bloques de “datos” en un meridiano */
  const blocks = new THREE.Group();
  const blockMat = meshMat(CYAN, 0.7);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.7, 0.25), blockMat);
    b.position.set(Math.cos(a) * 58, Math.sin(a) * 58, 0);
    b.lookAt(0, 0, 0);
    blocks.add(b);
  }
  blocks.rotation.y = 0.6;
  layerB.add(blocks);

  /* núcleo denso */
  const core = new THREE.Mesh(
    new THREE.IcosahedronGeometry(8.5, 1),
    new THREE.MeshBasicMaterial({ color: 0xd4fbff })
  );
  globe.add(core);
  const coreWire = new THREE.LineSegments(
    new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(9.2, 1)),
    lineMat(ICE, 0.7)
  );
  globe.add(coreWire);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: gtex, color: CYAN, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glow.scale.set(48, 48, 1);
  globe.add(glow);
  const glow2 = glow.clone();
  glow2.material = glow.material.clone();
  glow2.material.opacity = 0.35;
  glow2.scale.set(110, 110, 1);
  globe.add(glow2);

  /* partículas de energía en el volumen de la esfera */
  const PN = 420;
  const pPos = new Float32Array(PN * 3);
  for (let i = 0; i < PN; i++) {
    const r = 20 + Math.pow(Math.random(), 0.7) * 78;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pPos[i*3]     = r * Math.sin(ph) * Math.cos(th);
    pPos[i*3 + 1] = r * Math.sin(ph) * Math.sin(th);
    pPos[i*3 + 2] = r * Math.cos(ph);
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const sparks = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 1.8, map: gtex, color: ICE, transparent: true, opacity: 0.85,
    depthWrite: false, blending: THREE.AdditiveBlending
  }));
  globe.add(sparks);

  /* bloom: las líneas se leen como luz, no como alambre */
  let composer = null;
  let bloomPass = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass) {
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.25, 0.55, 0.12);
    composer.addPass(bloomPass);
  }

  const colorNow = new THREE.Color(CYAN);
  const colorTo  = new THREE.Color(CYAN);

  function setMode(next) {
    mode = next;
    document.querySelectorAll('.ui button').forEach(b => {
      b.classList.toggle('on', b.dataset.mode === mode);
    });
  }
  document.querySelectorAll('.ui button').forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });
  window.addEventListener('keydown', e => {
    if (e.key === '1') setMode('idle');
    if (e.key === '2') setMode('thinking');
    if (e.key === '3') setMode('speaking');
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    if (composer) composer.setSize(innerWidth, innerHeight);
  });

  function paint(obj, color) {
    if (obj.material && obj.material.color && obj !== core) obj.material.color.copy(color);
    for (const c of obj.children) paint(c, color);
  }

  function tick(t) {
    requestAnimationFrame(tick);
    const speaking = mode === 'speaking';
    const thinking = mode === 'thinking';
    const spin = speaking ? 2.4 : thinking ? 1.7 : 1;

    controls.autoRotateSpeed = 0.9 * spin;
    controls.update();

    layerA.rotation.y += 0.0035 * spin;
    layerA.rotation.z += 0.0012 * spin;
    layerB.rotation.y -= 0.0026 * spin;
    layerB.rotation.x += 0.0018 * spin;
    layerC.rotation.y += 0.0014 * spin;
    arcs.rotation.x += 0.004 * spin;
    sparks.rotation.y -= 0.0015 * spin;
    coreWire.rotation.y += 0.01 * spin;
    coreWire.rotation.x += 0.006 * spin;

    colorTo.set(speaking ? 0x00ffb3 : thinking ? 0x4af0ff : CYAN);
    colorNow.lerp(colorTo, 0.07);
    paint(globe, colorNow);
    core.material.color.copy(colorNow).lerp(new THREE.Color(0xffffff), 0.65);
    glow.material.color.copy(colorNow);
    glow2.material.color.copy(colorNow);

    const pulse = speaking
      ? 1 + Math.sin(t / 160) * 0.12
      : thinking
        ? 1 + Math.sin(t / 260) * 0.08
        : 1 + Math.sin(t / 700) * 0.04;
    core.scale.setScalar(pulse);
    glow.scale.set(48 * pulse, 48 * pulse, 1);
    glow2.scale.set(110 * pulse, 110 * pulse, 1);
    if (bloomPass) {
      bloomPass.strength = (speaking ? 1.55 : thinking ? 1.35 : 1.2) * (0.92 + pulse * 0.08);
    }

    if (composer) composer.render();
    else renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
